# Run the test suite against selected oldest and current compatibility targets.

name: Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported OVITO release on each supported architecture.
          - os: ubuntu-22.04
            python-version: "3.11"
            ovito-version: "3.11.0"
          - os: windows-2022
            python-version: "3.11"
            ovito-version: "3.11.0"
          - os: macos-26
            python-version: "3.11"
            ovito-version: "3.11.0"
          - os: macos-15-intel
            python-version: "3.11"
            ovito-version: "3.11.0"

          # Current release on current representative platforms.
          - os: ubuntu-24.04
            python-version: "3.13"
            ovito-version: "3.16.1"
          - os: windows-2022
            python-version: "3.13"
            ovito-version: "3.16.1"
          - os: macos-26
            python-version: "3.13"
            ovito-version: "3.16.1"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        python -m pip install "ovito==${{ matrix.ovito-version }}"
        python -m pip install .
    - name: Show installed versions
      run: |
        python --version
        python -m pip show ovito scipy
    - name: Test with pytest
      run: |
        pytest
