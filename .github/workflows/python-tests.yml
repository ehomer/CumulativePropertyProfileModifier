# Run the test suite against selected oldest and current compatibility targets.

name: Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported OVITO release on each supported architecture.
          - os: ubuntu-22.04
            python-version: "3.11"
            ovito-version: "3.11.3"
          - os: windows-2022
            python-version: "3.11"
            ovito-version: "3.11.3"
          - os: macos-26
            python-version: "3.11"
            ovito-version: "3.11.3"
          - os: macos-15-intel
            python-version: "3.11"
            ovito-version: "3.11.3"

          # Current release on current representative platforms.
          - os: ubuntu-24.04
            python-version: "3.13"
            ovito-version: "3.16.1"
          - os: windows-2022
            python-version: "3.13"
            ovito-version: "3.16.1"
          - os: macos-26
            python-version: "3.13"
            ovito-version: "3.16.1"
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install Linux graphics libraries
      if: startsWith(matrix.os, 'ubuntu-')
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libopengl0 libgl1
    - name: Install Python dependencies
      shell: bash
      run: |
        "${{ steps.setup-python.outputs.python-path }}" -m pip install --upgrade pip
        "${{ steps.setup-python.outputs.python-path }}" -m pip install pytest
        "${{ steps.setup-python.outputs.python-path }}" -m pip install "ovito==${{ matrix.ovito-version }}"
        "${{ steps.setup-python.outputs.python-path }}" -m pip install .
    - name: Show installed versions
      run: |
        "${{ steps.setup-python.outputs.python-path }}" --version
        "${{ steps.setup-python.outputs.python-path }}" -m pip show ovito scipy
    - name: Test with pytest
      run: |
        "${{ steps.setup-python.outputs.python-path }}" -m pytest
