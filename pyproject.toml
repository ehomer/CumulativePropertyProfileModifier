[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovito-cumulative-property-profile"
version = "0.1.0"
description = "OVITO modifier for atom-resolved cumulative particle-property profiles"
keywords = ["ovito", "ovito-extension"]
authors = [{name = "Eric Homer"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ovito >= 3.11.0",
    "scipy",
]

[project.urls]
repository = "https://github.com/ehomer/CumulativePropertyProfileModifier"

[project.entry-points.'OVITO.Modifier']
"Cumulative Property Profile" = "cumulative_property_profile:CumulativePropertyProfileModifier"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore:module 'sre_parse' is deprecated:DeprecationWarning",
    "ignore:module 'sre_constants' is deprecated:DeprecationWarning",
]
